<!DOCTYPE html>
<html lang="bn" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ariful | Personal Website & Book Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Lora for Serif Headings, Inter for Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
/* =========================
   Ariful Reading Tracker JS
   Bug-fixed drop-in version
   ========================= */

/* ---------- Utilities ---------- */
const STORAGE_KEY = 'ariful_reading_tracker_books';

function safeText(v, fallback = '') {
  return (v ?? fallback).toString();
}

function escapeHtml(str) {
  return safeText(str)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

function normalizeStatus(status) {
  const s = safeText(status).toLowerCase().trim();
  if (s === 'finished' || s === 'reading' || s === 'want') return s;
  return 'want';
}

function statusLabel(status) {
  switch (normalizeStatus(status)) {
    case 'finished': return 'পড়া শেষ';
    case 'reading': return 'এখন পড়ছি';
    default: return 'পড়তে চাই';
  }
}

function statusBadgeHtml(status) {
  const s = normalizeStatus(status);
  if (s === 'finished') {
    return `<span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">পড়া শেষ</span>`;
  }
  if (s === 'reading') {
    return `<span class="bg-amber-100 text-amber-800 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider animate-pulse">এখন পড়ছি</span>`;
  }
  return `<span class="bg-stone-100 text-stone-600 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">পড়তে চাই</span>`;
}

function generateId() {
  return String(Date.now()) + '-' + Math.random().toString(36).slice(2, 8);
}

/* ---------- Gemini API ---------- */
async function fetchGeminiAPI(payload) {
  // Keep empty for client-side safety unless you intentionally inject at build/deploy
  const apiKey = "";
  if (!apiKey) throw new Error('AI API key is not configured.');

  const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

  let retries = 0;
  const maxRetries = 3;
  let delay = 1000;

  while (retries < maxRetries) {
    try {
      const response = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        if (response.status === 429 || response.status >= 500) {
          throw new Error(`HTTP ${response.status}`);
        }
        const errData = await response.json().catch(() => ({}));
        throw new Error(errData?.error?.message || 'Gemini API Error');
      }

      return await response.json();
    } catch (error) {
      retries++;
      if (retries >= maxRetries) throw error;
      await new Promise(res => setTimeout(res, delay));
      delay *= 2;
    }
  }
}

/* ---------- Seed Data ---------- */
/* তোমার original initialBooks ডেটা এখানে unchanged রাখো।
   নিচে fallback হিসেবে minimal structure রাখছি যাতে runtime break না হয় যদি missing থাকে। */
const fallbackInitialBooks = [
  {
    id: '1',
    title: 'Atomic Habits',
    author: 'James Clear',
    status: 'finished',
    rating: 5,
    cover: 'https://placehold.co/200x300/F5F0E8/1E1E1E?text=Atomic+Habits',
    tags: ['Productivity'],
    dateFinished: 'জানুয়ারি ২০২৬',
    summary: 'ক্ষুদ্র অভ্যাসের বড় প্রভাব।',
    keyTakeaways: ['প্রতিদিন ১% উন্নতি করুন।'],
    quote: 'You do not rise to the level of your goals.'
  }
];

// If your existing file already defines initialBooks, use it; otherwise fallback.
const initialBooks = (typeof window.initialBooks !== 'undefined' && Array.isArray(window.initialBooks))
  ? window.initialBooks
  : fallbackInitialBooks;

/* ---------- App State ---------- */
let books = [];
let currentFilter = 'all';

/* ---------- Core ---------- */
function initApp() {
  try {
    const savedBooks = localStorage.getItem(STORAGE_KEY);
    if (savedBooks) {
      const parsed = JSON.parse(savedBooks);
      books = Array.isArray(parsed) ? parsed : [...initialBooks];
    } else {
      books = [...initialBooks];
      saveToLocalStorage();
    }
  } catch {
    books = [...initialBooks];
  }

  sanitizeBooks();
  renderBooks();
  updateStats();
  setupSearch();
  setupMobileMenu();
  bindFilterButtons();
  fixDuplicateAuthorInputIssue();
}

function sanitizeBooks() {
  books = books.map((b, idx) => ({
    id: safeText(b.id || generateId() || String(idx + 1)),
    title: safeText(b.title || 'Untitled'),
    author: safeText(b.author || 'Unknown'),
    status: normalizeStatus(b.status),
    rating: Math.max(0, Math.min(5, Number(b.rating || 0))),
    cover: safeText(b.cover || 'https://placehold.co/200x300/F5F0E8/1E1E1E?text=Book+Cover'),
    tags: Array.isArray(b.tags) ? b.tags.map(t => safeText(t)).filter(Boolean) : [],
    dateFinished: safeText(b.dateFinished || ''),
    summary: safeText(b.summary || ''),
    keyTakeaways: Array.isArray(b.keyTakeaways) ? b.keyTakeaways.map(k => safeText(k)).filter(Boolean) : [],
    quote: safeText(b.quote || '')
  }));
}

function saveToLocalStorage() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
}

function renderBooks(searchTerm = '') {
  const grid = document.getElementById('booksGrid');
  const emptyState = document.getElementById('emptyState');
  if (!grid || !emptyState) return;

  grid.innerHTML = '';
  const q = safeText(searchTerm).toLowerCase();

  const filtered = books.filter(book => {
    const matchesFilter =
      currentFilter === 'all' ? true :
      currentFilter === 'favorite' ? book.rating === 5 :
      book.status === currentFilter;

    const matchesSearch =
      book.title.toLowerCase().includes(q) ||
      book.author.toLowerCase().includes(q) ||
      book.tags.some(t => t.toLowerCase().includes(q));

    return matchesFilter && matchesSearch;
  });

  if (filtered.length === 0) {
    emptyState.classList.remove('hidden');
  } else {
    emptyState.classList.add('hidden');
    filtered.forEach(book => grid.appendChild(createBookCard(book)));
  }

  updateFilterCounts();
}

function createBookCard(book) {
  const card = document.createElement('div');
  card.className = "bg-white rounded-3xl border border-stone-200/80 shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden flex flex-col justify-between group cursor-pointer";
  card.addEventListener('click', () => openBookModal(book.id));

  let stars = '';
  if (book.rating > 0) {
    for (let i = 1; i <= 5; i++) {
      stars += `<i class="fa-solid fa-star ${i <= book.rating ? 'text-aliYellow' : 'text-stone-200'} text-xs"></i>`;
    }
  }

  card.innerHTML = `
    <div class="p-5 flex gap-4">
      <div class="w-24 h-36 flex-shrink-0 bg-stone-100 rounded-2xl overflow-hidden shadow-sm relative group-hover:scale-105 transition-transform">
        <img src="${escapeHtml(book.cover)}" alt="${escapeHtml(book.title)}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/200x300/F5F0E8/1E1E1E?text=Book+Cover'">
      </div>

      <div class="flex-grow flex flex-col justify-between">
        <div>
          <div class="flex items-center justify-between gap-2 mb-2">
            ${statusBadgeHtml(book.status)}
            ${book.rating ? `<div class="flex items-center gap-0.5">${stars}</div>` : ''}
          </div>
          <h3 class="font-serif font-bold text-aliDark text-lg leading-snug group-hover:text-aliOrange transition-colors line-clamp-2">
            ${escapeHtml(book.title)}
          </h3>
          <p class="text-xs text-stone-500 font-medium mt-1">লেখক: ${escapeHtml(book.author)}</p>
        </div>

        <div class="flex flex-wrap gap-1 mt-3">
          ${book.tags.map(t => `<span class="bg-aliBg text-stone-600 text-[10px] px-2 py-0.5 rounded-md font-semibold border border-stone-200/50">${escapeHtml(t)}</span>`).join('')}
        </div>
      </div>
    </div>

    <div class="px-5 py-3 bg-aliBg border-t border-stone-100 text-xs text-stone-600 line-clamp-2 italic">
      "${escapeHtml(book.summary || 'কোনো নোট দেওয়া হয়নি।')}"
    </div>
  `;

  return card;
}

/* Fixed: no dependency on global event */
function filterBooks(type, clickedBtn = null) {
  currentFilter = type;

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.remove('bg-aliDark', 'text-white');
    btn.classList.add('bg-white', 'text-stone-600');
  });

  if (clickedBtn) {
    clickedBtn.classList.remove('bg-white', 'text-stone-600');
    clickedBtn.classList.add('bg-aliDark', 'text-white');
  } else {
    const map = {
      all: "button[onclick*=\"filterBooks('all'\"]",
      finished: "button[onclick*=\"filterBooks('finished'\"]",
      reading: "button[onclick*=\"filterBooks('reading'\"]",
      want: "button[onclick*=\"filterBooks('want'\"]",
      favorite: "button[onclick*=\"filterBooks('favorite'\"]"
    };
    const activeBtn = document.querySelector(map[type] || '');
    if (activeBtn) {
      activeBtn.classList.remove('bg-white', 'text-stone-600');
      activeBtn.classList.add('bg-aliDark', 'text-white');
    }
  }

  const searchVal = document.getElementById('searchInput')?.value || '';
  renderBooks(searchVal);
}

/* Bind buttons robustly even if inline onclick exists */
function bindFilterButtons() {
  const wrap = document.querySelector('#books .flex.flex-wrap.gap-2');
  if (!wrap) return;
  const btns = wrap.querySelectorAll('.filter-btn');
  const types = ['all', 'finished', 'reading', 'want', 'favorite'];

  btns.forEach((btn, idx) => {
    if (!btn.dataset.boundFilter) {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        filterBooks(types[idx] || 'all', btn);
      });
      btn.dataset.boundFilter = '1';
    }
  });
}

function setupSearch() {
  const searchInput = document.getElementById('searchInput');
  if (!searchInput) return;
  searchInput.addEventListener('input', (e) => {
    renderBooks(e.target.value);
  });
}

/* Fixed: total books stat */
function updateStats() {
  const total = books.length;
  const finished = books.filter(b => b.status === 'finished').length;
  const reading = books.filter(b => b.status === 'reading').length;
  const want = books.filter(b => b.status === 'want').length;
  const topRated = books.filter(b => b.rating === 5).length;

  const statTotalBooks = document.getElementById('statTotalBooks');
  const statReadingNow = document.getElementById('statReadingNow');
  const statTopRated = document.getElementById('statTopRated');
  const statWantToRead = document.getElementById('statWantToRead');
  const yearlyCount = document.getElementById('yearlyCount');

  if (statTotalBooks) statTotalBooks.innerText = total;
  if (statReadingNow) statReadingNow.innerText = reading;
  if (statTopRated) statTopRated.innerText = topRated;
  if (statWantToRead) statWantToRead.innerText = want;
  if (yearlyCount) yearlyCount.innerText = finished; // yearly finished goal
}

function updateFilterCounts() {
  const all = document.getElementById('count-all');
  const finished = document.getElementById('count-finished');
  const reading = document.getElementById('count-reading');
  const want = document.getElementById('count-want');

  if (all) all.innerText = books.length;
  if (finished) finished.innerText = books.filter(b => b.status === 'finished').length;
  if (reading) reading.innerText = books.filter(b => b.status === 'reading').length;
  if (want) want.innerText = books.filter(b => b.status === 'want').length;
}

function openBookModal(id) {
  const book = books.find(b => b.id === id);
  if (!book) return;

  const modal = document.getElementById('bookModal');
  const content = document.getElementById('modalContent');
  if (!modal || !content) return;

  let stars = '';
  for (let i = 1; i <= 5; i++) {
    stars += `<i class="fa-solid fa-star ${i <= book.rating ? 'text-aliYellow' : 'text-stone-200'} text-base"></i>`;
  }

  const safeTitle = escapeHtml(book.title);
  const safeAuthor = escapeHtml(book.author);
  const safeSummary = escapeHtml(book.summary || 'কোনো নোট দেওয়া হয়নি।');

  content.innerHTML = `
    <div class="flex flex-col sm:flex-row gap-6 items-start">
      <img src="${escapeHtml(book.cover)}" alt="${safeTitle}" class="w-32 h-48 object-cover rounded-2xl shadow-md border border-stone-100 flex-shrink-0" onerror="this.src='https://placehold.co/200x300/F5F0E8/1E1E1E?text=Book+Cover'">
      <div>
        <div class="flex items-center gap-2 mb-2">
          <span class="bg-aliYellow text-aliDark text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">${statusLabel(book.status)}</span>
          ${book.dateFinished ? `<span class="text-xs text-stone-400">• শেষ করা হয়েছে: ${escapeHtml(book.dateFinished)}</span>` : ''}
        </div>
        <h2 class="text-2xl sm:text-3xl font-serif font-bold text-aliDark">${safeTitle}</h2>
        <p class="text-base font-semibold text-stone-600 mt-1">লেখক: ${safeAuthor}</p>

        <div class="flex items-center gap-1 mt-3">
          ${stars}
          <span class="text-sm text-stone-500 font-bold ml-2">${book.rating}/5</span>
        </div>

        <div class="flex flex-wrap gap-2 mt-4">
          ${book.tags.map(t => `<span class="bg-aliBg text-stone-700 text-xs font-semibold px-2.5 py-1 rounded-lg border border-stone-200">${escapeHtml(t)}</span>`).join('')}
        </div>
      </div>
    </div>

    <div class="mt-8 space-y-6">
      <div>
        <h4 class="text-xs font-bold text-stone-400 uppercase tracking-wider mb-2">সংক্ষিপ্ত নোট</h4>
        <p class="text-stone-700 leading-relaxed text-base bg-aliBg p-4 rounded-2xl border border-stone-200/80">${safeSummary}</p>
      </div>

      ${book.keyTakeaways?.length ? `
        <div>
          <h4 class="text-xs font-bold text-stone-400 uppercase tracking-wider mb-2"><i class="fa-solid fa-lightbulb text-aliYellow mr-1"></i> মূল শিক্ষা (Key Takeaways)</h4>
          <ul class="space-y-2">
            ${book.keyTakeaways.map(k => `<li class="flex items-start gap-2 text-sm text-stone-700"><i class="fa-solid fa-check text-emerald-600 mt-1 text-xs"></i> <span>${escapeHtml(k)}</span></li>`).join('')}
          </ul>
        </div>
      ` : ''}

      ${book.quote ? `
        <div>
          <h4 class="text-xs font-bold text-stone-400 uppercase tracking-wider mb-2">প্রিয় উদ্ধৃতি (Favorite Quote)</h4>
          <blockquote class="border-l-4 border-aliOrange pl-4 py-2 italic text-stone-800 text-base font-serif bg-orange-50/50 rounded-r-xl">
            "${escapeHtml(book.quote)}"
          </blockquote>
        </div>
      ` : ''}

      <div class="bg-gradient-to-r from-amber-50 to-orange-50 p-5 rounded-2xl border border-amber-200/80">
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-bold text-amber-900 uppercase tracking-wider flex items-center gap-1.5">
            <i class="fa-solid fa-wand-magic-sparkles text-aliOrange"></i> ✨ AI Deep Dive Analysis
          </span>
          <button onclick="askAiAboutBook('${book.title.replace(/'/g, "\\'")}', '${book.author.replace(/'/g, "\\'")}')" id="aiDeepDiveBtn" class="bg-aliOrange hover:bg-aliOrangeHover text-white text-xs font-bold px-3 py-2 rounded-lg transition-all">
            জীবনধারায় প্রয়োগের উপায় জানতে ক্লিক করুন
          </button>
        </div>
        <div id="aiDeepDiveResult" class="text-xs text-stone-700 leading-relaxed space-y-2 hidden"></div>
      </div>
    </div>

    <div class="mt-8 pt-4 border-t border-stone-100 flex justify-between items-center">
      <button onclick="deleteBook('${book.id}')" class="text-red-500 hover:text-red-700 text-xs font-bold flex items-center gap-1">
        <i class="fa-regular fa-trash-can"></i> মুছে ফেলুন
      </button>
      <button onclick="closeBookModal()" class="bg-aliDark text-white text-xs font-bold px-6 py-2.5 rounded-xl">বন্ধ করুন</button>
    </div>
  `;

  modal.classList.remove('hidden');
  modal.classList.add('flex');
  document.body.style.overflow = 'hidden';
}

function closeBookModal() {
  const modal = document.getElementById('bookModal');
  if (!modal) return;
  modal.classList.add('hidden');
  modal.classList.remove('flex');
  document.body.style.overflow = 'auto';
}

function openAddBookModal() {
  const modal = document.getElementById('addBookModal');
  if (!modal) return;
  modal.classList.remove('hidden');
  modal.classList.add('flex');
  document.body.style.overflow = 'hidden';
}

function closeAddBookModal() {
  const modal = document.getElementById('addBookModal');
  if (!modal) return;
  modal.classList.add('hidden');
  modal.classList.remove('flex');
  document.body.style.overflow = 'auto';
}

function handleAddNewBook(event) {
  event.preventDefault();

  const title = document.getElementById('newTitle')?.value?.trim() || '';
  const author = document.getElementById('newAuthor')?.value?.trim() || '';
  const status = normalizeStatus(document.getElementById('newStatus')?.value || 'want');
  const rating = Number(document.getElementById('newRating')?.value || 0);
  const cover = document.getElementById('newCover')?.value?.trim() || 'https://placehold.co/200x300/F5F0E8/1E1E1E?text=Book+Cover';
  const tagsRaw = document.getElementById('newTags')?.value || '';
  const summary = document.getElementById('newSummary')?.value?.trim() || '';

  if (!title || !author) {
    alert('বইয়ের নাম এবং লেখকের নাম অবশ্যই দিতে হবে।');
    return;
  }

  const tags = tagsRaw.split(',').map(t => t.trim()).filter(Boolean);

  const newBook = {
    id: generateId(),
    title,
    author,
    status,
    rating: Math.max(0, Math.min(5, rating)),
    cover,
    tags,
    dateFinished: status === 'finished' ? new Date().toLocaleDateString('bn-BD', { month: 'long', year: 'numeric' }) : '',
    summary,
    keyTakeaways: [],
    quote: ''
  };

  books.unshift(newBook);
  saveToLocalStorage();
  renderBooks(document.getElementById('searchInput')?.value || '');
  updateStats();

  const form = event.target;
  if (form && typeof form.reset === 'function') form.reset();

  closeAddBookModal();
}

function deleteBook(id) {
  const ok = confirm('আপনি কি নিশ্চিতভাবে এই বইটি মুছে ফেলতে চান?');
  if (!ok) return;

  books = books.filter(b => b.id !== id);
  saveToLocalStorage();
  renderBooks(document.getElementById('searchInput')?.value || '');
  updateStats();
  closeBookModal();
}

/* ---------- AI Chat ---------- */
function appendAiMessage(sender, text) {
  const box = document.getElementById('aiChatBox');
  if (!box) return;

  const isUser = sender === 'user';
  const wrap = document.createElement('div');
  wrap.className = `flex gap-3 ${isUser ? 'justify-end' : ''}`;

  wrap.innerHTML = isUser
    ? `
      <div class="bg-aliDark text-white p-3 rounded-2xl rounded-tr-none border border-stone-700 shadow-sm max-w-[85%] leading-relaxed">
        ${escapeHtml(text)}
      </div>
      <div class="w-8 h-8 rounded-full bg-aliDark text-white flex items-center justify-center font-bold text-xs flex-shrink-0">You</div>
    `
    : `
      <div class="w-8 h-8 rounded-full bg-aliBlue text-white flex items-center justify-center font-bold text-xs flex-shrink-0">AI</div>
      <div class="bg-white p-3 rounded-2xl rounded-tl-none border border-stone-200/60 shadow-sm text-stone-700 leading-relaxed max-w-[85%]">
        ${escapeHtml(text)}
      </div>
    `;

  box.appendChild(wrap);
  box.scrollTop = box.scrollHeight;
}

function setAiPrompt(text) {
  const input = document.getElementById('aiChatInput');
  if (!input) return;
  input.value = text;
  input.focus();
}

async function handleAiChatSubmit(e) {
  e.preventDefault();
  const input = document.getElementById('aiChatInput');
  const btn = document.getElementById('aiChatSubmitBtn');
  if (!input || !btn) return;

  const prompt = input.value.trim();
  if (!prompt) return;

  appendAiMessage('user', prompt);
  input.value = '';
  btn.disabled = true;
  btn.classList.add('opacity-60', 'cursor-not-allowed');

  try {
    const context = books.map(b => `${b.title} by ${b.author} (${b.status}, rating ${b.rating}/5)`).join('\n');
    const payload = {
      contents: [{
        role: "user",
        parts: [{
          text: `You are Ariful's reading assistant. Reply in Bengali. Context books:\n${context}\n\nUser question: ${prompt}`
        }]
      }]
    };

    const data = await fetchGeminiAPI(payload);
    const reply =
      data?.candidates?.[0]?.content?.parts?.[0]?.text ||
      'দুঃখিত, এই মুহূর্তে উত্তর তৈরি করা যায়নি।';
    appendAiMessage('ai', reply);
  } catch (err) {
    appendAiMessage('ai', 'AI সার্ভিস এখন কনফিগার করা নেই বা সাময়িকভাবে বন্ধ আছে। পরে আবার চেষ্টা করুন।');
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.classList.remove('opacity-60', 'cursor-not-allowed');
  }
}

async function askAiAboutBook(title, author) {
  const btn = document.getElementById('aiDeepDiveBtn');
  const result = document.getElementById('aiDeepDiveResult');
  if (!btn || !result) return;

  btn.disabled = true;
  btn.classList.add('opacity-60', 'cursor-not-allowed');
  result.classList.remove('hidden');
  result.innerHTML = 'বিশ্লেষণ তৈরি হচ্ছে...';

  try {
    const payload = {
      contents: [{
        role: "user",
        parts: [{
          text: `বাংলায় সংক্ষেপে বলো: "${title}" by ${author} বইয়ের মূল শিক্ষা এবং দৈনন্দিন জীবনে প্রয়োগের ৫টি বাস্তব উপায়।`
        }]
      }]
    };
    const data = await fetchGeminiAPI(payload);
    const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || 'বিশ্লেষণ পাওয়া যায়নি।';
    result.innerHTML = `<div class="whitespace-pre-wrap">${escapeHtml(reply)}</div>`;
  } catch (err) {
    result.innerHTML = 'AI সার্ভিস কনফিগার করা নেই বা এই মুহূর্তে অনুপলব্ধ।';
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.classList.remove('opacity-60', 'cursor-not-allowed');
  }
}

async function autoFillWithAI() {
  const titleInput = document.getElementById('newTitle');
  const authorInput = document.getElementById('newAuthor');
  const summaryInput = document.getElementById('newSummary');
  const tagsInput = document.getElementById('newTags');

  const title = titleInput?.value?.trim() || '';
  const author = authorInput?.value?.trim() || '';

  if (!title) {
    alert('প্রথমে বইয়ের নাম লিখুন, তারপর AI Auto-Fill ব্যবহার করুন।');
    return;
  }

  const btn = document.getElementById('aiAutofillBtn');
  if (btn) {
    btn.disabled = true;
    btn.classList.add('opacity-60', 'cursor-not-allowed');
  }

  try {
    const payload = {
      contents: [{
        role: "user",
        parts: [{
          text: `Book: ${title}${author ? ` by ${author}` : ''}\nবাংলায় JSON দাও:\n{"summary":"", "tags":["",""], "rating":4}\nশুধু JSON, অতিরিক্ত টেক্সট নয়।`
        }]
      }]
    };
    const data = await fetchGeminiAPI(payload);
    const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text || '{}';

    const jsonText = raw.match(/\{[\s\S]*\}/)?.[0] || '{}';
    const parsed = JSON.parse(jsonText);

    if (summaryInput && parsed.summary) summaryInput.value = parsed.summary;
    if (tagsInput && Array.isArray(parsed.tags)) tagsInput.value = parsed.tags.join(', ');
    const ratingSel = document.getElementById('newRating');
    if (ratingSel && parsed.rating && [1,2,3,4,5].includes(Number(parsed.rating))) {
      ratingSel.value = String(parsed.rating);
    }
  } catch (e) {
    alert('AI Auto-Fill এখন কাজ করছে না। ম্যানুয়ালি তথ্য দিন।');
    console.error(e);
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.classList.remove('opacity-60', 'cursor-not-allowed');
    }
  }
}

/* ---------- Newsletter ---------- */
function handleSubscribe(e) {
  e.preventDefault();
  const msg = document.getElementById('subMessage');
  if (msg) msg.classList.remove('hidden');
  e.target?.reset?.();
}

/* ---------- Mobile Menu ---------- */
function setupMobileMenu() {
  const btn = document.getElementById('mobileMenuBtn');
  const menu = document.getElementById('mobileMenu');
  if (!btn || !menu) return;

  btn.addEventListener('click', () => {
    menu.classList.toggle('hidden');
  });

  menu.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => menu.classList.add('hidden'));
  });
}

/* ---------- Modal backdrop close ---------- */
document.addEventListener('click', (e) => {
  const bookModal = document.getElementById('bookModal');
  const addBookModal = document.getElementById('addBookModal');

  if (bookModal && e.target === bookModal) closeBookModal();
  if (addBookModal && e.target === addBookModal) closeAddBookModal();
});

/* ---------- ESC close ---------- */
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  closeBookModal();
  closeAddBookModal();
});

/* ---------- Fix duplicate newAuthor field if present in HTML ---------- */
function fixDuplicateAuthorInputIssue() {
  const authorInputs = document.querySelectorAll('#newAuthor');
  if (authorInputs.length <= 1) return;

  // Keep first, disable duplicates to avoid form ambiguity
  authorInputs.forEach((el, idx) => {
    if (idx > 0) {
      el.removeAttribute('id');
      el.setAttribute('data-duplicate-author', '1');
      el.disabled = true;
      el.placeholder = 'Duplicate field disabled';
      el.classList.add('opacity-50', 'cursor-not-allowed');
    }
  });
}

/* ---------- Boot ---------- */
window.addEventListener('DOMContentLoaded', initApp);
